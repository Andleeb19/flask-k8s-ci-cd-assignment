apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  labels:
    app: flask-app
spec:
  type: NodePort  # Makes the service accessible outside the cluster
  selector:
    app: flask-app
  ports:
  - protocol: TCP
    port: 80          # Port exposed by the service
    targetPort: 5000  # Port on the container
    nodePort: 30080   # Port to access from outside (30000-32767)
  sessionAffinity: None  # Load balance across all pods
